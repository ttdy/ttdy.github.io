<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>聚合影院</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif; background: #111; color: #eee; }
    .box { width: min(360px, 90vw); text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .tip { font-size: 14px; color: #aaa; min-height: 22px; }
    .list { margin: 16px 0 0; padding: 0; list-style: none; font-size: 13px; color: #888; text-align: left; }
    .list li { padding: 6px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
    .ok { color: #7cc36a; }
    .fail { color: #e06666; }
    .btns { margin-top: 18px; display: none; flex-direction: column; gap: 8px; }
    .btns.show { display: flex; }
    a, button { display: block; width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333;
      background: #1c1c1c; color: #eee; text-decoration: none; font-size: 14px; cursor: pointer; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div class="box">
    <h1>聚合影院</h1>
    <div class="tip" id="tip">正在选择最快线路…</div>
    <ul class="list" id="list"></ul>
    <div class="btns" id="btns">
      <a href="https://tvgg.de5.net/">tvgg.de5.net</a>
      <a href="https://vod-box.pages.dev/">vod-box.pages.dev</a>
      <a href="https://tvdd.us.ci/">tvdd.us.ci</a>
      <a href="https://ttys.cn.mt/">ttys.cn.mt</a>
      <a href="https://tttv.66ghz.com/">tttv.66ghz.com</a>
      <a href="https://tttv.10001mb.com/">tttv.10001mb.com</a>
      <button type="button" id="retry">重新测速</button>
    </div>
  </div>
  <script>
    (function () {
      var HOSTS = [
        'https://tvgg.de5.net',
        'https://vod-box.pages.dev',
        'https://tvdd.us.ci',
        'https://ttys.cn.mt'
      ];
      var PHP_HOSTS = [
        'https://tttv.66ghz.com',
        'https://tttv.10001mb.com'
      ];
      var KEY = 'vb_jump_host';
      var AT = 'vb_jump_at';
      var TTL = 2 * 60 * 1000;
      var tip = document.getElementById('tip');
      var list = document.getElementById('list');
      var btns = document.getElementById('btns');

      function ping(host, path) {
        var t0 = Date.now();
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, 2500);
        var url = host + (path || '/abc.json');
        url += (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + t0;
        return fetch(url, { cache: 'no-store', signal: ctrl.signal })
          .then(function (r) {
            if (!r.ok) return null;
            return { host: host, ms: Date.now() - t0 };
          })
          .catch(function () { return null; })
          .then(function (r) { clearTimeout(timer); return r; });
      }

      function go(host) {
        try {
          localStorage.setItem(KEY, host);
          localStorage.setItem(AT, String(Date.now()));
        } catch (e) {}
        location.replace(host + '/');
      }

      function known(host) {
        return HOSTS.indexOf(host) >= 0 || PHP_HOSTS.indexOf(host) >= 0;
      }

      function run(force) {
        tip.textContent = '正在选择最快线路…';
        list.innerHTML = '';
        btns.classList.remove('show');
        function probeAll() {
          Promise.all(HOSTS.map(function (h) { return ping(h, '/abc.json'); })).then(function (rows) {
            var ok = [];
            HOSTS.forEach(function (h, i) {
              var r = rows[i];
              var li = document.createElement('li');
              if (r) {
                ok.push(r);
                li.innerHTML = '<span class="ok">' + h.replace(/^https:\/\//, '') + '</span><span class="ok">' + r.ms + 'ms</span>';
              } else {
                li.innerHTML = '<span class="fail">' + h.replace(/^https:\/\//, '') + '</span><span class="fail">超时</span>';
              }
              list.appendChild(li);
            });
            ok.sort(function (a, b) { return a.ms - b.ms; });
            if (ok[0]) {
              tip.textContent = '进入 ' + ok[0].host.replace(/^https:\/\//, '');
              setTimeout(function () { go(ok[0].host); }, 200);
              return;
            }
            Promise.all(PHP_HOSTS.map(function (h) { return ping(h, '/api.php?action=sources'); })).then(function (phpRows) {
              var phpOk = [];
              PHP_HOSTS.forEach(function (h, i) {
                var r = phpRows[i];
                var li = document.createElement('li');
                if (r) {
                  phpOk.push(r);
                  li.innerHTML = '<span class="ok">' + h.replace(/^https:\/\//, '') + '</span><span class="ok">' + r.ms + 'ms</span>';
                } else {
                  li.innerHTML = '<span class="fail">' + h.replace(/^https:\/\//, '') + '</span><span class="fail">超时</span>';
                }
                list.appendChild(li);
              });
              phpOk.sort(function (a, b) { return a.ms - b.ms; });
              if (phpOk[0]) {
                tip.textContent = '进入 ' + phpOk[0].host.replace(/^https:\/\//, '');
                setTimeout(function () { go(phpOk[0].host); }, 200);
              } else {
                tip.textContent = '线路都不可达，请手动选择';
                btns.classList.add('show');
              }
            });
          });
        }
        if (!force) {
          try {
            var saved = localStorage.getItem(KEY);
            var at = Number(localStorage.getItem(AT) || 0);
            if (saved && known(saved) && Date.now() - at < TTL) {
              tip.textContent = '检测上次线路…';
              ping(saved, PHP_HOSTS.indexOf(saved) >= 0 ? '/api.php?action=sources' : '/abc.json').then(function (r) {
                if (r) { go(saved); return; }
                probeAll();
              });
              return;
            }
          } catch (e) {}
        }
        probeAll();
      }

      document.getElementById('retry').onclick = function () { run(true); };
      run(false);
    })();
  </script>
</body>
</html>
